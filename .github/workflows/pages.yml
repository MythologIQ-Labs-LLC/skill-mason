name: Qortara Skills Pages (static Prism client)
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
      - 'assets/brand/**'
      - 'trials/ci-failure-triage-v5/**'
      - 'tests/external_trial_kit.test.mjs'
      - '.github/ISSUE_TEMPLATE/skill-trial-feedback.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
      - 'assets/brand/**'
      - 'trials/ci-failure-triage-v5/**'
      - 'tests/external_trial_kit.test.mjs'
      - '.github/ISSUE_TEMPLATE/skill-trial-feedback.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install exact browser dependencies, no lifecycle scripts
        run: npm install --no-save --ignore-scripts --package-lock=false prism-code@0.9.5 esbuild@0.25.12
      - name: Test client-side contract and refusal cases
        run: node --test web/tests/*.test.mjs tests/external_trial_kit.test.mjs
      - name: Bundle client with local Prism runtime
        run: node web/build.mjs
      - name: Refuse incomplete Pages application output
        shell: bash
        run: |
          set -euo pipefail
          test -s web-dist/index.html
          test -s web-dist/app.js
          test -s web-dist/style.css
          test -s web-dist/assets/qortara-skills-icon.webp
          test -s web-dist/assets/qortara-skills-banner.webp
          test -f web-dist/.nojekyll
          grep -qF './app.js' web-dist/index.html
          echo "Pages artifact has the built application entrypoint, runtime bundle, stylesheet and brand assets"
      - name: Upload static Pages build
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web-dist
  deploy:
    # Manual dispatch on main is an explicit recovery path for the application artifact.
    # GitHub Pages must also be set to Source = GitHub Actions (not branch/Jekyll).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
