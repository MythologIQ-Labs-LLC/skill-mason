name: Source-approval receipt integrity (P0 candidate only)
on:
  pull_request:
    paths:
      - 'src/backend/compose.mjs'
      - 'tests/backend_compose.test.mjs'
      - 'tests/backend_source_approval_receipt.test.mjs'
      - 'docs/technical/backend-source-approval-receipt-v1.md'
      - '.github/workflows/backend-source-receipt.yml'
  push:
    branches: [main]
    paths:
      - 'src/backend/compose.mjs'
      - 'tests/backend_source_approval_receipt.test.mjs'
      - '.github/workflows/backend-source-receipt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed-source-proof-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline composer and dual proof-digest replay regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node.split(".")[0]')" -ge 22
          node --test tests/backend_compose.test.mjs tests/backend_source_approval_receipt.test.mjs tests/backend_signed_assertions.test.mjs
          git diff --exit-code -- src/backend/compose.mjs tests/backend_source_approval_receipt.test.mjs
