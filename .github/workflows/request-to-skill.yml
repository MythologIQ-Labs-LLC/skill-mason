name: Request-to-skill exact pinned corpus admission (no rights grant)

on:
  pull_request:
    paths:
      - 'scripts/request_to_skill.py'
      - 'tests/test_request_to_skill.py'
      - 'scripts/user_route_discovery.py'
      - 'tests/test_user_route_discovery.py'
      - 'scripts/prism_input_preflight.py'
      - 'tests/test_prism_input_preflight.py'
      - 'bin/qortara-skills.mjs'
      - 'tests/local_cli.test.mjs'
      - 'docs/technical/request-to-skill-cli-v1.md'
      - '.github/workflows/request-to-skill.yml'
      - 'docs/README.md'
  push:
    branches: [main]
    paths:
      - 'scripts/request_to_skill.py'
      - 'tests/test_request_to_skill.py'
      - 'scripts/user_route_discovery.py'
      - 'tests/test_user_route_discovery.py'
      - 'scripts/prism_input_preflight.py'
      - 'tests/test_prism_input_preflight.py'
      - 'bin/qortara-skills.mjs'
      - 'tests/local_cli.test.mjs'
      - '.github/workflows/request-to-skill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-pinned-request-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout Skill Mason without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22 for the ordinary CLI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Execute Gherkin refusal and adversarial contract tests
        run: |
          set -euo pipefail
          python3 --version
          node --version
          python3 -m unittest discover -s tests -p 'test_request_to_skill.py' -v
          python3 -m unittest discover -s tests -p 'test_user_route_discovery.py' -v
          python3 -m unittest discover -s tests -p 'test_prism_input_preflight.py' -v
          node --test tests/local_cli.test.mjs
      - name: Checkout immutable Skillz handoff
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Knapp-Kevin/skillz
          ref: efba572262fc5fa3ff1934b054aa4f15ce149c1a
          path: skillz-export
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize independent exact source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C skillz-export rev-parse HEAD)" = efba572262fc5fa3ff1934b054aa4f15ce149c1a
          git -C skillz-export -c core.hooksPath=/dev/null worktree add --detach ../skillz-source 31a8c518dd97b7828adcc728202fa41388a306d7
          test "$(git -C skillz-source rev-parse 'HEAD^{tree}')" = e6d5dfeb42bcd7777ddff52605922fead62135ff
      - name: Real 247-route discovery from original pinned catalog through ordinary CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p route-evidence
          python3 -m scripts.user_route_discovery \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source --summary \
            > route-evidence/summary.json
          python3 -m scripts.user_route_discovery \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source --search frontend --limit 10 \
            > route-evidence/search.json
          python3 -m scripts.user_route_discovery \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source --path software-engineering/frontend \
            > route-evidence/detail.json
          (
            cd route-evidence
            node ../bin/qortara-skills.mjs routes \
              --handoff ../skillz-export/registry/exports/skill-mason-v1 \
              --source-checkout ../skillz-source --search frontend --limit 10 \
              > node-search.json
          )
          set +e
          node bin/qortara-skills.mjs routes \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source --path imaginary/unrecognized \
            > route-evidence/unknown-route.json
          unknown_rc=$?
          set -e
          test "$unknown_rc" -eq 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path("route-evidence")
          summary=json.loads((base/"summary.json").read_text())
          search=json.loads((base/"search.json").read_text())
          detail=json.loads((base/"detail.json").read_text())
          node=json.loads((base/"node-search.json").read_text())
          missing=json.loads((base/"unknown-route.json").read_text())
          assert summary["recognized_domain_count"]==33
          assert summary["recognized_route_count"]==247
          assert summary["unmapped_governed_identity_count"]==921
          assert summary["routes"]==[]
          assert summary["production_eligible"] is False
          assert search==node, "user-facing Node CLI must preserve Python discovery receipts"
          assert search["mode"]=="SEARCH"
          assert any(x["path"]=="software-engineering/frontend" for x in search["routes"])
          assert detail["mode"]=="SHOW"
          route=detail["routes"][0]
          assert route["path"]=="software-engineering/frontend"
          assert route["essential_outcomes"]
          assert route["composition_eligible"] is False
          assert all(x["rights_clearance"]=="not-established"
                     for x in route["evidence_linked_reviews"])
          assert missing["state"]=="REFUSED"
          assert missing["code"]=="UNRECOGNIZED_CAPABILITY"
          for obj in (summary,search,detail,node):
              assert obj["pinned_source_commit"]=="31a8c518dd97b7828adcc728202fa41388a306d7"
              assert obj["pinned_source_tree"]=="e6d5dfeb42bcd7777ddff52605922fead62135ff"
              assert obj["composition_eligible"] is False
              assert obj["source_rights_established"] is False
              assert obj["host_validated"] is False
          print("REAL PINNED ROUTE DISCOVERY PASS: 247 recognized, frontend searched and inspected, Node/Python parity, unknown route refused")
          PY
      - name: Run actual user requests with pinned source comparisons and check refusals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p request-evidence
          set +e
          python3 -m scripts.request_to_skill \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --request "Build an accessible responsive UI component with keyboard interactions" \
            --route software-engineering/frontend \
            --host ChatGPT \
            --method governed:anthropic-skills/frontend-design \
            > request-evidence/frontend-source-refusal.json
          frontend_rc=$?
          python3 -m scripts.request_to_skill \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --request "Review memory provenance and trace original source evidence" \
            --route memory-context/provenance \
            --host Claude \
            > request-evidence/unmapped-route-refusal.json
          unmapped_rc=$?
          node bin/qortara-skills.mjs create \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --request "Build an accessible responsive UI component with keyboard interactions" \
            --route software-engineering/frontend \
            --host ChatGPT \
            --method governed:anthropic-skills/frontend-design \
            > request-evidence/node-cli-frontend-refusal.json
          cli_rc=$?
          (
            cd request-evidence
            node ../bin/qortara-skills.mjs create               --handoff ../skillz-export/registry/exports/skill-mason-v1               --source-checkout ../skillz-source               --request "Build an accessible responsive UI component with keyboard interactions"               --route software-engineering/frontend               --host ChatGPT               --method governed:anthropic-skills/frontend-design               > node-cli-caller-relative-refusal.json
          )
          relative_rc=$?
          set -e
          printf '%s\n' "$frontend_rc $unmapped_rc $cli_rc $relative_rc" > request-evidence/exit-codes.txt
          test "$frontend_rc" -eq 2
          test "$unmapped_rc" -eq 2
          test "$cli_rc" -eq 2
          test "$relative_rc" -eq 2
          python3 - <<'PY'
          from pathlib import Path
          import json
          base=Path("request-evidence")
          frontend=json.loads((base/"frontend-source-refusal.json").read_text())
          unmapped=json.loads((base/"unmapped-route-refusal.json").read_text())
          cli=json.loads((base/"node-cli-frontend-refusal.json").read_text())
          outside=json.loads((base/"node-cli-caller-relative-refusal.json").read_text())
          for result in (frontend,unmapped,cli,outside):
              assert result["schema"] == "qortara/request-to-skill-evaluation/1"
              assert result["state"] == "REFUSED_PRE_ADMISSION"
              assert result["production_eligible"] is False
              assert result["composer_invoked"] is False
              assert result["prism_invoked"] is False
              assert result["output_package_created"] is False
              assert result["pinned_source"]["commit"] == "31a8c518dd97b7828adcc728202fa41388a306d7"
              assert result["pinned_source"]["git_tree_sha1"] == "e6d5dfeb42bcd7777ddff52605922fead62135ff"
          assert frontend == cli == outside, "root and caller-relative Node CLI must return exact identical pinned source results"
          assert frontend["refusal"]["code"] == "RIGHTS_UNRESOLVED"
          assert "SOURCE_PACKAGE_BYTES_UNVERIFIED" in frontend["refusal"]["codes"]
          assert frontend["inspected_governed_record_not_selected_for_composition"] == (
              "governed:anthropic-skills/frontend-design")
          assert unmapped["refusal"]["code"] == "MAPPING_GAP"
          assert unmapped["evidence_linked_review_count"] == 0
          assert unmapped["inspected_governed_record_not_selected_for_composition"] is None
          print("LIVE PINNED REQUEST REFUSALS PASS: frontend, unmapped, Node CLI root and outside-cwd parity")
          PY
          git status --porcelain --untracked-files=all > request-evidence/source-status.txt
          test -z "$(git status --porcelain --untracked-files=all | grep -v -e '^?? request-evidence/' -e '^?? skillz-export/' -e '^?? skillz-source/' || true)"
      - name: Checkout exact external first-party-owned upstream sample without executing its contents
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: anthropics/skills
          ref: 8a1541c4a3ffa5a20a5a91de0dcf3f0bab1d1ef4
          path: external-source
          fetch-depth: 1
          submodules: false
          persist-credentials: false
          lfs: false
      - name: Gherkin real ordinary CLI C3-C4-C5 same-source package and tamper controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external-source rev-parse HEAD)" = 8a1541c4a3ffa5a20a5a91de0dcf3f0bab1d1ef4
          test "$(git -C external-source rev-parse 'HEAD^{tree}')" = d482eba557f7b2035c8a83589809628b96f6f40e
          set +e
          python3 -m scripts.request_to_skill \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --request "Build an accessible responsive UI component with keyboard interactions" \
            --route software-engineering/frontend \
            --host ChatGPT \
            --method governed:anthropic-skills/frontend-design \
            --external-checkout external-source \
            --external-repository-tree d482eba557f7b2035c8a83589809628b96f6f40e \
            > request-evidence/pinned-external-python.json
          python_rc=$?
          (
            cd request-evidence
            node ../bin/qortara-skills.mjs create \
              --handoff ../skillz-export/registry/exports/skill-mason-v1 \
              --source-checkout ../skillz-source \
              --request "Build an accessible responsive UI component with keyboard interactions" \
              --route software-engineering/frontend \
              --host ChatGPT \
              --method governed:anthropic-skills/frontend-design \
              --external-checkout ../external-source \
              --external-repository-tree d482eba557f7b2035c8a83589809628b96f6f40e \
              > pinned-external-cli.json
          )
          cli_rc=$?
          node bin/qortara-skills.mjs create \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --request "Build an accessible responsive UI component with keyboard interactions" \
            --route software-engineering/frontend --host ChatGPT \
            --method governed:anthropic-skills/frontend-design \
            --external-checkout external-source \
            --external-repository-tree 0000000000000000000000000000000000000000 \
            > request-evidence/external-wrong-tree-denial.json
          tamper_rc=$?
          set -e
          test "$python_rc" -eq 2
          test "$cli_rc" -eq 2
          test "$tamper_rc" -eq 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("request-evidence")
          python = json.loads((root / "pinned-external-python.json").read_text())
          cli = json.loads((root / "pinned-external-cli.json").read_text())
          wrong = json.loads((root / "external-wrong-tree-denial.json").read_text())
          assert python == cli, "ordinary Node CLI must faithfully delegate the real pinned external C3-C4-C5 receipt"
          assert python["state"] == "REFUSED_PRE_ADMISSION"
          assert python["refusal"]["code"] == "RIGHTS_UNRESOLVED"
          assert python["exact_source_package_bytes_verified"] is True
          assert python["selected_package_comparison_source_bound"] is True
          assert python["comparison_reused_for_preflight_without_second_source_scan"] is True
          assert python["selected_source_binding_sha256"] and len(python["selected_source_binding_sha256"]) == 64
          assert python["inspected_governed_record_not_selected_for_composition"] == (
              "governed:anthropic-skills/frontend-design")
          rows = [x for x in python["candidates"]
                  if x["governed_id"] == "anthropic-skills/frontend-design"]
          assert len(rows) == 1
          package = rows[0]["package_bytes"]
          assert package["status"] == "EXTERNAL_PACKAGE_PINNED_BYTES_VERIFIED"
          assert package["package_files"] == 2
          assert package["asset_files_requiring_review"] == 2
          assert package["source_license_pointer_evidence_present"] is True
          assert package["source_asset_rights_and_dependencies_still_unqualified"] is True
          assert package["rights_and_host_still_unapproved"] is True
          assert package["package_git_tree_sha1"] == "d79e2a5bb4df4a386c2adcdd9ab8709bba28c3f6"
          assert "SOURCE_PACKAGE_BYTES_UNVERIFIED" not in python["refusal"]["codes"]
          for key in ("production_eligible","method_rights_established","host_validated",
                      "prism_invoked","composer_invoked","output_package_created"):
              assert python[key] is False, key
          assert wrong["state"] == "REFUSED_PRE_ADMISSION"
          assert wrong["refusal"]["code"] in ("EXTERNAL_SOURCE_PIN","EXTERNAL_PIN")
          assert wrong["composer_invoked"] is False
          assert wrong["output_package_created"] is False
          print("REAL SINGLE-PASS C3-C4-C5 PASS: two Git-verified files, one license pointer,")
          print("same direct-Python/caller-directory-Node response, no rights approval, wrong-tree refused")
          PY
      - name: Upload bounded user-visible original-source route discovery results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pinned-route-discovery-receipts
          path: route-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload bounded real source and refusal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pinned-user-request-refusal-receipts
          path: request-evidence/
          retention-days: 14
          if-no-files-found: warn
