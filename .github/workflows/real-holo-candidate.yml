name: Real Prism candidate assembly (P0 development only)
# Temporary exact-branch validation for two original first-party pilots.
# Restore manual-only before main integration: upstream artifact expires.
on:
  pull_request:
    paths:
      - '.github/workflows/real-holo-candidate.yml'
      - 'tests/real_holo_candidate_acceptance.mjs'
      - 'bin/first-party-pilot.mjs'
      - 'src/backend/**'
      - 'pilots/first-party/**'
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Exact existing full native-gate run containing the pinned holo
        required: true
        default: '44235570627'
      native_artifact_id:
        description: Exact nested artifact ID from that run
        required: true
        default: '14399257681'
permissions: {}
concurrency:
  group: real-holo-candidate-${{ github.ref }}
  cancel-in-progress: true
env:
  HOLO_SHA256: 9ebac1a33da068be7c1c81bc7652938811936089df5a026b7ce5aee1f8f7ed3e
  MANIFEST_SHA256: cca7f46f31b909a22602505e3ccf3a6fbeb1ec0bc9a692c381bc7db2d0988518
  PRISM_CODE_INTEGRITY: sha512-PcXiUzhYJwY4ZM9wKpzazq5m/KVCWooj8dFF+7l57KcUQpNdiVDbETyYFo4A9O6OoY9tVghg5YawkIlgYYUjNA==
jobs:
  stage-pinned-development-holo:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    # Never stage for fork PRs; this temporary validation is internal only.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/backend-recipe-v0-pinned-selection-20261118')
    permissions:
      actions: read
    steps:
      - name: Retrieve one exact earlier native evidence artifact by run and artifact id
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          repository: MythologIQ-Labs-LLC/skill-mason
          run-id: ${{ inputs.native_run_id || '44235570627' }}
          artifact-ids: ${{ inputs.native_artifact_id || '14399257681' }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pinned-evidence
      - name: Verify recorded native receipt and original holo identity (never execute here)
        shell: bash
        run: |
          set -euo pipefail
          # Artifact name can change when the same pinned holo is rebuilt.
          # Accept exactly one matching file of each type, regardless of wrapper.
          mapfile -d '' -t holos < <(find "$RUNNER_TEMP/pinned-evidence" -type f -path '*/nested/out/holo/eligibility.holo' -print0)
          mapfile -d '' -t manifests < <(find "$RUNNER_TEMP/pinned-evidence" -type f -path '*/nested/out/receipts/eligibility/manifest.json' -print0)
          test "${#holos[@]}" -eq 1 && test "${#manifests[@]}" -eq 1
          holo="${holos[0]}"
          manifest="${manifests[0]}"
          test -f "$holo" && test -f "$manifest"
          test "$(stat -c %s "$holo")" = 17346
          test "$(sha256sum "$holo" | cut -d' ' -f1)" = "$HOLO_SHA256"
          test "$(sha256sum "$manifest" | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          mkdir "$RUNNER_TEMP/standalone-holo"
          cp -- "$holo" "$RUNNER_TEMP/standalone-holo/eligibility.holo"
          chmod 0600 "$RUNNER_TEMP/standalone-holo/eligibility.holo"
      - name: Transfer only the hash-verified holo to a new credential-free job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pinned-p0-eligibility-holo
          path: ${{ runner.temp }}/standalone-holo/eligibility.holo
          if-no-files-found: error
          retention-days: 7
  run-in-isolated-prism-consumer:
    needs: stage-pinned-development-holo
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions: {}
    steps:
      - name: Checkout review branch without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Retrieve same-run verified artifact without repository token
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pinned-p0-eligibility-holo
          path: ${{ runner.temp }}/holo
      - name: Verify holo and pinned independent Prism runtime before execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$RUNNER_TEMP/holo/eligibility.holo" | cut -d' ' -f1)" = "$HOLO_SHA256"
          test "$(stat -c %s "$RUNNER_TEMP/holo/eligibility.holo")" = 17346
          mkdir "$RUNNER_TEMP/npm-pin" && cd "$RUNNER_TEMP/npm-pin"
          npm pack --silent prism-code@0.9.5
          actual="sha512-$(openssl dgst -sha512 -binary prism-code-0.9.5.tgz | base64 -w0)"
          test "$actual" = "$PRISM_CODE_INTEGRITY"
          cd "$GITHUB_WORKSPACE"
          npm install --no-save --ignore-scripts --omit=optional --package-lock=false "$RUNNER_TEMP/npm-pin/prism-code-0.9.5.tgz"
          node -e 'if(require("prism-code/package.json").version!=="0.9.5")process.exit(1)'
      - name: Execute real P0 guest for signed-claim positive and negative fixtures without network
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}" && test -z "${GITHUB_TOKEN:-}"
          # Host runner is disposable; no repository privileges, no secrets.
          # Only the guest stage enters a separate network namespace.
          sudo -n unshare --net -- sudo -n -u "$(id -un)" env \
            "PATH=$PATH" "HOME=$HOME" "RUNNER_TEMP=$RUNNER_TEMP" \
            node tests/real_holo_candidate_acceptance.mjs \
              --holo "$RUNNER_TEMP/holo/eligibility.holo" \
              --sha256 "$HOLO_SHA256" \
              --report "$RUNNER_TEMP/candidate-pilot.json"
      - name: Upload result with explicit fixture-only assurance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-prism-p0-candidate-pilot
          path: |
            ${{ runner.temp }}/candidate-pilot.json
            ${{ runner.temp }}/first-party-pilot-candidates/**
          if-no-files-found: error
          retention-days: 14
