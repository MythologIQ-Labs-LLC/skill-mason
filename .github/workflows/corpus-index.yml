name: Corpus opportunity index (pinned, read-only)
on:
  pull_request:
    paths:
      - 'scripts/catalog_index.py'
      - 'scripts/snapshot_accession.py'
      - 'tests/test_snapshot_accession.py'
      - 'docs/technical/snapshot-accession-v1.md'
      - 'scripts/corpus_evolution.py'
      - 'scripts/package_resolver.py'
      - 'scripts/candidate_comparison.py'
      - 'scripts/capability_gap_backlog.py'
      - 'tests/test_capability_gap_backlog.py'
      - 'docs/technical/capability-gap-backlog-v1.md'
      - 'docs/technical/essential-workflow-proposals-v1.json'
      - 'tests/test_candidate_comparison.py'
      - 'docs/technical/candidate-comparison-v1.md'
      - 'tests/test_package_resolver.py'
      - 'docs/technical/package-inspection-v1.md'
      - 'tests/test_corpus_evolution.py'
      - 'scripts/capability_graph.py'
      - 'tests/test_catalog_index.py'
      - 'scripts/catalog_handoff.py'
      - 'scripts/verify_catalog_source.py'
      - '.github/workflows/corpus-index.yml'
      - 'docs/technical/corpus-index-v1.md'
      - 'docs/technical/corpus-evolution-v1.md'
      - 'docs/technical/capability-graph-v1.md'
      - 'docs/architecture/skill-mason-pipeline-v0.md'
      - 'docs/README.md'
  push:
    branches: [main]
    paths:
      - 'scripts/catalog_index.py'
      - 'scripts/snapshot_accession.py'
      - 'tests/test_snapshot_accession.py'
      - 'docs/technical/snapshot-accession-v1.md'
      - 'scripts/corpus_evolution.py'
      - 'scripts/package_resolver.py'
      - 'scripts/candidate_comparison.py'
      - 'scripts/capability_gap_backlog.py'
      - 'tests/test_capability_gap_backlog.py'
      - 'docs/technical/capability-gap-backlog-v1.md'
      - 'docs/technical/essential-workflow-proposals-v1.json'
      - 'tests/test_candidate_comparison.py'
      - 'docs/technical/candidate-comparison-v1.md'
      - 'tests/test_package_resolver.py'
      - 'docs/technical/package-inspection-v1.md'
      - 'tests/test_corpus_evolution.py'
      - 'scripts/capability_graph.py'
      - 'tests/test_catalog_index.py'
      - 'scripts/catalog_handoff.py'
      - 'scripts/verify_catalog_source.py'
      - '.github/workflows/corpus-index.yml'
      - 'docs/technical/corpus-index-v1.md'
      - 'docs/technical/capability-graph-v1.md'
      - 'docs/architecture/skill-mason-pipeline-v0.md'
      - 'docs/README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout Skill Mason (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify synthetic omissions, shadowed bytes and refusal controls
        run: |
          python3 -m unittest discover -s tests -p 'test_catalog_index.py' -v
          python3 -m unittest discover -s tests -p 'test_corpus_evolution.py' -v
          python3 -m unittest discover -s tests -p 'test_package_resolver.py' -v
          python3 -m unittest discover -s tests -p 'test_candidate_comparison.py' -v
          python3 -m unittest discover -s tests -p 'test_capability_gap_backlog.py' -v
          python3 -m unittest discover -s tests -p 'test_snapshot_accession.py' -v
      - name: Checkout immutable published handoff (no submodules)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Knapp-Kevin/skillz
          ref: efba572262fc5fa3ff1934b054aa4f15ce149c1a
          path: skillz-export
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Materialize separately pinned original source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C skillz-export rev-parse HEAD)" = efba572262fc5fa3ff1934b054aa4f15ce149c1a
          git -C skillz-export -c core.hooksPath=/dev/null worktree add --detach ../skillz-source 31a8c518dd97b7828adcc728202fa41388a306d7
          test "$(git -C skillz-source rev-parse 'HEAD^{tree}')" = e6d5dfeb42bcd7777ddff52605922fead62135ff
      - name: Reconcile complete opportunity space and perform cross-family lexical search
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.catalog_index \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source summary > corpus-index-summary.json
          python3 -m scripts.catalog_index \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source search "SKILL.md" --family four-source --limit 2 > corpus-four-source-search.json
          python3 -m scripts.catalog_index \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source references "registry/discovery" --kind discovery --limit 2 > corpus-reference-search.json
          python3 -m scripts.capability_graph \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source summary > corpus-capability-summary.json
          python3 -m scripts.capability_graph \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source show "software-engineering/frontend" > corpus-capability-example.json
          python3 -m scripts.capability_gap_backlog \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --proposals docs/technical/essential-workflow-proposals-v1.json \
            summary --limit 40 > corpus-capability-gaps.json
          python3 -m scripts.capability_gap_backlog \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --proposals docs/technical/essential-workflow-proposals-v1.json \
            focus memory-context/provenance > corpus-workflow-proposal-example.json
          python3 -m scripts.candidate_comparison \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --route "software-engineering/frontend" --host ChatGPT --limit 5 > corpus-comparison-example.json
          python3 -m scripts.package_resolver \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source first-party-scan > corpus-package-scan.json
          python3 -m scripts.snapshot_accession \
            --old-handoff skillz-export/registry/exports/skill-mason-v1 \
            --old-source-checkout skillz-source \
            --candidate-handoff skillz-export/registry/exports/skill-mason-v1 \
            --candidate-source-checkout skillz-source \
            --candidate-manifest-blob 55974d44fdfde36bd537a552feac933c341e1895 \
            --candidate-source-commit 31a8c518dd97b7828adcc728202fa41388a306d7 \
            --candidate-source-tree e6d5dfeb42bcd7777ddff52605922fead62135ff \
            > corpus-accession-noop.json
          python3 -m scripts.corpus_evolution \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source summary > corpus-evolution-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("corpus-index-summary.json").read_text())
          assert (x["governed"], x["governed_mapped"], x["governed_unmapped"]) == (1043, 122, 921)
          assert (x["g1_g3_path_observations"], x["four_source_path_observations"]) == (61326, 4813)
          assert (x["discovery_artifact_pointers"], x["evidence_artifact_pointers"]) == (170, 2322)
          assert x["total_index_rows_not_unique_skills"] == 67182
          assert x["source_integrity"] == "PINNED_TREE_AND_SOURCE_BYTES_VERIFIED"
          assert not x["composition_eligible"] and not x["rights_assessed"]
          y = json.loads(Path("corpus-four-source-search.json").read_text())
          assert y["total_matches"] > 0 and y["returned"] == 2
          assert y["truncated"] and not y["method_eligibility_assessed"]
          z = json.loads(Path("corpus-reference-search.json").read_text())
          assert z["total_matches"] > 0 and z["returned"] == 2
          assert z["truncated"] and not z["method_eligibility_assessed"]
          graph = json.loads(Path("corpus-capability-summary.json").read_text())
          assert (graph["recognized_domains"], graph["recognized_subdomains"]) == (33, 247)
          assert graph["evidence_mapped_governed_identities"] == 122
          assert not graph["composition_eligible"] and not graph["rights_assessed"]
          example = json.loads(Path("corpus-capability-example.json").read_text())
          assert example["path"] == "software-engineering/frontend"
          assert example["explicit_gaps"]["rights_not_assessed"] and not example["composition_eligible"]
          gaps = json.loads(Path("corpus-capability-gaps.json").read_text())
          assert (gaps["recognized_domains"], gaps["recognized_subdomains"]) == (33, 247)
          assert gaps["essential_outcome_definitions_missing"] == 246
          assert gaps["unqualified_or_unknown_outcome_routes"] == 247
          assert gaps["reviewed_identities_with_evidence_links"] == 122
          assert gaps["governed_reviews_unmapped"] == 921
          assert gaps["draft_workflow_proposals_pending_review"] == 13
          assert gaps["work_queue_total"] == 247
          assert len(set(row["domain"] for row in gaps["queue_sample"][:33])) == 33
          assert not gaps["composition_eligible"] and gaps["methods_admitted"] == 0
          focus = json.loads(Path("corpus-workflow-proposal-example.json").read_text())
          assert focus["route"]["route"] == "memory-context/provenance"
          assert focus["proposed_workflow"]["proposal_status"] == "DRAFT_NOT_GOVERNED"
          assert not focus["actual_registered_essential_outcomes"] and not focus["composition_eligible"]
          print("Recognized capability gap categories:", gaps["gap_categories"])
          print("Cross-domain draft outcomes pending upstream review:", gaps["draft_workflow_proposals_pending_review"])
          cmp = json.loads(Path("corpus-comparison-example.json").read_text())
          assert cmp["route"] == "software-engineering/frontend"
          assert cmp["declared_observation_rows_swept"] == 66139
          assert cmp["eligible_candidate_count"] == 0 and cmp["chosen_method"] is None
          assert not cmp["composition_eligible"] and not cmp["prism_invoked"]
          assert cmp["receipt_not_a_best_method_rank"] and cmp["unmapped_and_unreviewed_methods_may_be_relevant"]
          assert cmp["evidence_linked_review_count"] == len(cmp["evidence_linked_reviews"])
          print("C4 comparison receipt counts:", {"evidence": cmp["evidence_linked_review_count"],
                                                 "name_leads": cmp["name_only_lead_count"],
                                                 "lexical_observations": cmp["lexical_observation_match_count"]})
          pkg = json.loads(Path("corpus-package-scan.json").read_text())
          assert pkg["first_party_reviewed"] == 48
          assert pkg["all_48_checked_without_silent_omission"]
          assert not pkg["rights_assessed"] and not pkg["host_qualified"]
          assert not pkg["composition_eligible"] and not pkg["third_party_complete_packages_assessed"]
          print("First-party package inspection outcomes:", pkg["results_by_status"])
          accession = json.loads(Path("corpus-accession-noop.json").read_text())
          assert accession["state"] == "PINNED_SNAPSHOT_DIFF_ONLY"
          assert not accession["exact_revisions_differ"] and not accession["data_delta_nonempty"]
          assert accession["governed"]["before"] == accession["governed"]["after"] == 1043
          assert accession["observed_source_rows"]["before"] == accession["observed_source_rows"]["after"] == 66139
          assert accession["tracked_source_files"]["before"] == accession["tracked_source_files"]["after"] == 2825
          for family in ("governed", "observed_source_rows", "tracked_source_files"):
              assert all(accession[family][kind]["count"] == 0 for kind in ("added", "removed", "changed"))
          assert accession["review_status_transitions"] == []
          assert accession["taxonomy_artifacts_changed"] == []
          assert not accession["candidate_snapshot_auto_imported"]
          assert not accession["snapshot_accession_authorized"]
          assert not accession["composition_eligible"]
          assert not accession["candidate_publisher_independently_authenticated"]
          print("Full exact-pinned source accession no-op:", "1043 reviewed, 66139 observed, 2825 tracked, 0 delta, NO ADMISSION")
          evolution = json.loads(Path("corpus-evolution-summary.json").read_text())
          assert evolution["observed_path_rows"] == 66139
          assert evolution["source_family_rows"] == {"four-source": 4813, "g1-g3": 61326}
          assert evolution["fully_specified_placement_claims"] <= 66139
          assert not evolution["composition_eligible"] and not evolution["content_equivalence_verified_from_bytes"]
          assert evolution["source_observations_preserved"] and not evolution["mirror_reuse_rights_inferred"]
          print("Source identity accounting:", json.dumps(evolution, sort_keys=True))

          print("C2 recognized capability outcome definitions missing:", graph["outcome_definitions_missing"])
          print("C2 routes with unqualified/unknown essential outcomes:", graph["unqualified_or_unknown_outcome_routes"])
          print("C1 PINNED OPPORTUNITY INDEX: PASS (not rights or host qualification)")
          PY
      - name: Upload non-content reconciliation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pinned-corpus-index-summary
          path: |
            corpus-index-summary.json
            corpus-capability-summary.json
            corpus-evolution-summary.json
            corpus-accession-noop.json
            corpus-package-scan.json
            corpus-comparison-example.json
            corpus-capability-gaps.json
            corpus-workflow-proposal-example.json
          retention-days: 14
          if-no-files-found: error
