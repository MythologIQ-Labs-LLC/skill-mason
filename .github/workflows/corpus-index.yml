      - 'docs/README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout Skill Mason (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify synthetic omissions, shadowed bytes and refusal controls
        run: |
          python3 -m unittest discover -s tests -p 'test_catalog_index.py' -v
          python3 -m unittest discover -s tests -p 'test_corpus_evolution.py' -v
          python3 -m unittest discover -s tests -p 'test_package_resolver.py' -v
          python3 -m unittest discover -s tests -p 'test_corpus_reference_dossier.py' -v
          python3 -m unittest discover -s tests -p 'test_source_task_fit_review.py' -v
          python3 -m unittest discover -s tests -p 'test_source_only_fit_review.py' -v
          python3 -m unittest discover -s tests -p 'test_candidate_comparison.py' -v
          python3 -m unittest discover -s tests -p 'test_capability_gap_backlog.py' -v
          python3 -m unittest discover -s tests -p 'test_live_capability_probe.py' -v
          python3 -m unittest discover -s tests -p 'test_snapshot_accession.py' -v
          python3 -m unittest discover -s tests -p 'test_prism_input_preflight.py' -v
      - name: Checkout immutable published handoff (no submodules)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Knapp-Kevin/skillz
          ref: efba572262fc5fa3ff1934b054aa4f15ce149c1a
          path: skillz-export
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Materialize separately pinned original source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C skillz-export rev-parse HEAD)" = efba572262fc5fa3ff1934b054aa4f15ce149c1a
          git -C skillz-export -c core.hooksPath=/dev/null worktree add --detach ../skillz-source 31a8c518dd97b7828adcc728202fa41388a306d7
          test "$(git -C skillz-source rev-parse 'HEAD^{tree}')" = e6d5dfeb42bcd7777ddff52605922fead62135ff
      - name: Inspect source-grounded reference method and line citation from pinned corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corpus-reference-evidence
          python3 -m scripts.corpus_reference_dossier \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --all-first-party > corpus-reference-evidence/first-party-inventory.json
          python3 -m scripts.corpus_reference_dossier \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --route security/supply-chain \
            > corpus-reference-evidence/mcp-route.json
          python3 -m scripts.corpus_reference_dossier \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --route security/supply-chain \
            --method governed:local-skills/mcp-vetting \
            --file SKILL.md --lines 17:21 \
            > corpus-reference-evidence/mcp-pinned-citation.json
          python3 -m scripts.source_task_fit_review \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --review docs/evidence/source-task-fit-mcp-vetting-v1.json \
            > corpus-reference-evidence/mcp-narrow-task-fit.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('corpus-reference-evidence')
          whole=json.loads((root/'first-party-inventory.json').read_text())
          assert whole['schema']=='qortara/first-party-source-reference-inventory/1'
          assert whole['state']=='FULL_PINNED_FIRST_PARTY_SOURCE_REVIEW_QUEUE'
          assert whole['total_original_first_party_review_records']==48
          assert whole['route_linked_record_count']+whole['unmapped_review_record_count']==48
          assert len(whole['original_source_reference_records'])==48
          ids=[x['governed_review_id'] for x in whole['original_source_reference_records']]
          assert ids==sorted(set(ids))
          assert sum(whole['source_package_inspection_counts'].values())==48
          assert sum(whole['next_qualification_action_counts'].values())==48
          assert whole['all_pinned_first_party_review_records_retained']
          assert whole['non_first_party_methods_not_authored_or_licensed_by_this_scan']
          assert not whole['rights_qualified'] and not whole['host_validated']
          assert not whole['composition_eligible'] and not whole['production_eligible']
          print('FIRST-PARTY ORIGINAL SOURCE QUEUE PASS:',whole['next_qualification_action_counts'])
          fit=json.loads((root/'mcp-narrow-task-fit.json').read_text())
          assert fit['schema']=='qortara/source-task-fit-reference-review/1'
          assert fit['state']=='BOUNDED_ORIGINAL_SOURCE_TASK_REFERENCE_NOT_ADMITTED'
          assert fit['governed_review_id']=='governed:local-skills/mcp-vetting'
          assert fit['route']=='security/supply-chain'
          assert fit['source_snapshot_commit']=='31a8c518dd97b7828adcc728202fa41388a306d7'
          assert fit['source_snapshot_tree']=='e6d5dfeb42bcd7777ddff52605922fead62135ff'
          assert fit['entrypoint_git_blob_sha1']=='37a13d7296c7d3d87dc360988bc6aca1f873c4db'
          assert {x['role'] for x in fit['source_evidence']}=={
              'TRIGGER_AND_LIMIT','METHOD_STEPS','EVIDENCE_AND_REPORT','SAFETY_BOUNDARY'}
          assert len(fit['source_evidence'])==4
          assert fit['acceptance_scenarios_planned_not_executed']==5
          assert fit['actual_consumer_host_task_runs']==0
          assert len(fit['broader_claims_not_supported'])>=2
          assert fit['source_quotes_prove_bytes_not_reviewers_semantic_conclusion']
          for row in fit['source_evidence']:
              assert row['source_url'].startswith(
                  'https://github.com/Knapp-Kevin/skillz/blob/31a8c518dd97b7828adcc728202fa41388a306d7/')
              assert hashlib.sha256(row['original_lines_for_review'].encode()).hexdigest()==row['exact_excerpt_sha256']
          for field in ('rights_qualified','host_validated','outcome_coverage_qualified',
                        'operator_source_acceptance_signed','prism_invoked',
                        'composition_eligible','production_eligible'):
              assert fit[field] is False
          print('PINNED TASK-FIT SOURCE PASS: bounded MCP procedure, four original source roles, five future scenarios, zero admission')
          route=json.loads((root/'mcp-route.json').read_text())
          cited=json.loads((root/'mcp-pinned-citation.json').read_text())
          assert route['schema']=='qortara/original-source-reference-dossier/1'
          assert route['route']==cited['route']=='security/supply-chain'
          assert route['original_source_citation'] is None
          assert route['linked_governed_review_count']==len(route['candidates'])
          assert route['linked_governed_review_count']==len(cited['candidates'])
          assert route['linked_governed_review_count']>0
          rows={r['governed_review_id']:r for r in route['candidates']}
          assert 'governed:local-skills/mcp-vetting' in rows
          method=rows['governed:local-skills/mcp-vetting']
          assert method['source_class']=='first-party'
          assert method['inspection_state']=='PINNED_FIRST_PARTY_PACKAGE_BYTES_VERIFIED'
          assert method['original_package']['entrypoint_url'].endswith('/skills/mcp-vetting/SKILL.md')
          assert method['original_package']['complete_source_bytes_verified'] is True
          assert method['original_package']['full_dependency_closure_proven'] is False
          excerpt=cited['original_source_citation']
          assert excerpt['source_url'].endswith('/skills/mcp-vetting/SKILL.md#L17-L21')
          assert 'without installing, connecting, running, or invoking it' in excerpt['exact_original_lines_for_human_review']
          assert hashlib.sha256(excerpt['exact_original_lines_for_human_review'].encode()).hexdigest()==excerpt['exact_source_excerpt_sha256']
          for report in (route,cited):
              assert report['exact_source_commit']=='31a8c518dd97b7828adcc728202fa41388a306d7'
              assert report['exact_source_tree']=='e6d5dfeb42bcd7777ddff52605922fead62135ff'
              for state in ('composition_eligible','production_eligible','host_validated',
                            'rights_qualified','outcome_coverage_qualified','prism_invoked'):
                  assert report[state] is False
          print('PINNED REFERENCE DOSSIER PASS: original MCP source and bounded line evidence, no rights or host promotion')
          PY
      - name: Qualify three different source-specific method workbenches against exact original Skillz bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.catalog_index import CorpusIndex
          from scripts.capability_graph import CapabilityGraph
          from scripts.source_task_fit_review import assess_task_fit
          root = Path("corpus-reference-evidence")
          graph = CapabilityGraph(CorpusIndex(
              "skillz-export/registry/exports/skill-mason-v1", "skillz-source"))
          methods = {
              "repo-doctor": "fed90fa0a664611e560bbc3ded630eb9e72253e1",
              "agent-postmortem": "dde789e87da090b92021b3e55304299244f62ac2",
              "permissions-review": "18f46840032829963715ec23894f7826dbbfcb77",
          }
          roles = {"TRIGGER_AND_LIMIT", "METHOD_STEPS",
                   "EVIDENCE_AND_REPORT", "SAFETY_BOUNDARY"}
          for name, blob in methods.items():
              source = Path("docs/evidence/source-task-fit-" + name + "-v1.json")
              review = json.loads(source.read_text())
              report = assess_task_fit(graph, review)
              assert report["state"] == "BOUNDED_ORIGINAL_SOURCE_TASK_REFERENCE_NOT_ADMITTED"
              assert report["governed_review_id"] == "governed:local-skills/" + name
              assert report["route"] is None
              assert report["source_only_review_no_route_claim"] is True
              assert report["original_evidence_linked_routes_not_task_qualified"]
              assert report["entrypoint_git_blob_sha1"] == blob
              assert report["source_snapshot_commit"] == "31a8c518dd97b7828adcc728202fa41388a306d7"
              assert report["source_snapshot_tree"] == "e6d5dfeb42bcd7777ddff52605922fead62135ff"
              assert report["source_quotes_prove_bytes_not_reviewers_semantic_conclusion"]
              assert {x["role"] for x in report["source_evidence"]} == roles
              assert report["acceptance_scenarios_planned_not_executed"] == 5
              assert report["actual_consumer_host_task_runs"] == 0
              assert report["registered_route_outcomes_not_qualified"] is None
              for evidence in report["source_evidence"]:
                  assert evidence["original_path"].startswith("skills/" + name + "/")
                  assert evidence["source_url"].startswith(
                      "https://github.com/Knapp-Kevin/skillz/blob/31a8c518dd97b7828adcc728202fa41388a306d7/")
                  assert evidence["original_lines_for_review"]
              for gate in ("rights_qualified", "host_validated", "outcome_coverage_qualified",
                           "operator_source_acceptance_signed", "prism_invoked",
                           "composition_eligible", "production_eligible"):
                  assert report[gate] is False
              (root / (name + "-task-fit.json")).write_text(json.dumps(report,sort_keys=True))
              print("PINNED ORIGINAL TASK SCOPE PASS",name,
                    report["original_evidence_linked_routes_not_task_qualified"],
                    "5 future scenarios, 0 host runs, no approval")
          PY
          for method in repo-doctor agent-postmortem permissions-review; do
            node bin/qortara-skills.mjs task-fit \
              --review "docs/evidence/source-task-fit-${method}-v1.json" \
              --handoff skillz-export/registry/exports/skill-mason-v1 \
              --source-checkout skillz-source \
              > "corpus-reference-evidence/node-${method}-task-fit.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("corpus-reference-evidence")
          for name in ("repo-doctor","agent-postmortem","permissions-review"):
              direct=json.loads((root/(name+"-task-fit.json")).read_text())
              cli=json.loads((root/("node-"+name+"-task-fit.json")).read_text())
              assert direct==cli,(name,"CLI changed original source review")
          print("ALL 3 ORIGINAL SOURCE TASK CONTRACTS PASS: exact upstream packages, 15 planned scenarios, no false rights or host approval")
          PY
      - name: Replay six original Skillz method tasks and adversarial qualitative controls
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/corpus_three_originals_qualitative.test.mjs
          node scripts/grade_corpus_three_originals.mjs > corpus-reference-evidence/three-source-direct-trial.json
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const q=JSON.parse(readFileSync("corpus-reference-evidence/three-source-direct-trial.json","utf8"));
            if(q.total!==6||q.passed!==6||q.failed!==0||
               q.distinctOriginalMethods!==3||
               q.independentConsumingHostRuns!==0||
               q.approvedForComposition!==0||q.productionEligible!==false)
              process.exit(1);
            console.log("3 ORIGINAL METHODS, 6 DIRECT AUTHOR-APPLIED CASES: PASS (not blind, no host use, no rights)");
          '
      - name: Exercise normal Node CLI against the exact original 48-source corpus
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/corpus_reference_cli.test.mjs
          node bin/qortara-skills.mjs references --all-first-party \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            > corpus-reference-evidence/node-first-party-inventory.json
          node bin/qortara-skills.mjs references --route security/supply-chain \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            > corpus-reference-evidence/node-mcp-route.json
          node bin/qortara-skills.mjs references --route security/supply-chain \
            --method governed:local-skills/mcp-vetting \
            --file SKILL.md --lines 17:21 \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            > corpus-reference-evidence/node-mcp-citation.json
          node bin/qortara-skills.mjs task-fit \
            --review docs/evidence/source-task-fit-mcp-vetting-v1.json \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            > corpus-reference-evidence/node-mcp-task-fit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('corpus-reference-evidence')
          for original, node in (
              ('first-party-inventory.json','node-first-party-inventory.json'),
              ('mcp-route.json','node-mcp-route.json'),
              ('mcp-pinned-citation.json','node-mcp-citation.json'),
              ('mcp-narrow-task-fit.json','node-mcp-task-fit.json')):
              a=json.loads((base/original).read_text())
              b=json.loads((base/node).read_text())
              assert a==b,(original,node,'CLI changed original source inspector evidence')
          print('ORIGINAL CORPUS USER CLI PASS: 48 records, route, exact source quotation and bounded task-fit; 4/4 byte-equivalent records with direct Python')
          PY
      - name: Reconcile complete opportunity space and perform cross-family lexical search
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.catalog_index \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source summary > corpus-index-summary.json
          python3 -m scripts.catalog_index \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source search "SKILL.md" --family four-source --limit 2 > corpus-four-source-search.json
          python3 -m scripts.catalog_index \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source references "registry/discovery" --kind discovery --limit 2 > corpus-reference-search.json
          python3 -m scripts.capability_graph \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source summary > corpus-capability-summary.json
          python3 -m scripts.capability_graph \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source show "software-engineering/frontend" > corpus-capability-example.json
          python3 -m scripts.capability_gap_backlog \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --proposals docs/technical/essential-workflow-proposals-v1.json \
            summary --limit 40 > corpus-capability-gaps.json
          python3 -m scripts.live_capability_probe \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --proposals docs/technical/essential-workflow-proposals-v1.json \
            > corpus-live-capability-probe.json
          python3 -m scripts.capability_gap_backlog \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --proposals docs/technical/essential-workflow-proposals-v1.json \
            focus memory-context/provenance > corpus-workflow-proposal-example.json
          python3 -m scripts.candidate_comparison \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --route "software-engineering/frontend" --host ChatGPT --limit 5 > corpus-comparison-example.json
          python3 -m scripts.prism_input_preflight \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source \
            --route software-engineering/frontend --host ChatGPT \
            --governed-record governed:anthropic-skills/frontend-design \
            > corpus-prism-denial-preflight.json
          python3 -m scripts.package_resolver \
            --handoff skillz-export/registry/exports/skill-mason-v1 \
            --source-checkout skillz-source first-party-scan > corpus-package-scan.json
          python3 -m scripts.snapshot_accession \
            --old-handoff skillz-export/registry/exports/skill-mason-v1 \
            --old-source-checkout skillz-source \
            --candidate-handoff skillz-export/registry/exports/skill-mason-v1 \
            --candidate-source-checkout skillz-source \
            --candidate-manifest-blob 55974d44fdfde36bd537a552feac933c341e1895 \
            --candidate-source-commit 31a8c518dd97b7828adcc728202fa41388a306d7 \
            --candidate-source-tree e6d5dfeb42bcd7777ddff52605922fead62135ff \
            > corpus-accession-noop.json
