name: CI triage v3-v4 qualitative pair (sealed real P0 packages)

on:
  pull_request:
    paths:
      - 'bin/ci-triage-v3-v4-compare.mjs'
      - 'tests/ci_triage_v3_v4_compare.test.mjs'
      - '.github/workflows/ci-triage-v3-v4-pair.yml'
  workflow_dispatch:
    inputs:
      model:
        description: 'Approved text-only model ID (30 cases x 2 versions, 60 billable calls)'
        type: string
        required: true
      consent:
        description: 'Enter COMPARE_60_V3_V4_CALLS to authorize bounded model spending'
        type: string
        required: true

permissions:
  contents: read

jobs:
  sealed-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Static comparator and refusal controls (no model)
        run: node --test tests/ci_triage_v3_v4_compare.test.mjs
      - name: Download exact real-P0 generated candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          repository: MythologIQ-Labs-LLC/skill-mason
          run-id: '44605700825'
          artifact-ids: '14570605430'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/real-p0-source
      - name: Verify both sealed candidates and run full 60-arm mock transport
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/real-p0-source/first-party-request-candidates"
          test -f "$root/ci-failure-triage-v3/.qortara-complete"
          test -f "$root/ci-failure-triage-v4/.qortara-complete"
          test "$(sha256sum "$root/ci-failure-triage-v3/SKILL.md" | cut -d' ' -f1)" = 2ded798ba865468ae2f0a8a649c1f2172c89a810e73e27cbef7e7e458f69274e
          test "$(sha256sum "$root/ci-failure-triage-v4/SKILL.md" | cut -d' ' -f1)" = 51908ef10d7fb461563752c63225fdf14e01c18bfd27e44257ed04e6b8e5b83a
          CI_TRIAGE_PAIR_V3_DIR="$root/ci-failure-triage-v3" \
          CI_TRIAGE_PAIR_V4_DIR="$root/ci-failure-triage-v4" \
             node --test tests/ci_triage_v3_v4_compare.test.mjs
          echo "Pinned v3/v4 generated skill bytes and 60 mock transport calls passed; NO host model has been invoked"
      - name: Stage exact pair for separately authorized host job
        if: github.event_name == 'workflow_dispatch' && inputs.consent == 'COMPARE_60_V3_V4_CALLS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/paired-for-model"
          cp -a "$RUNNER_TEMP/real-p0-source/first-party-request-candidates/ci-failure-triage-v3" "$RUNNER_TEMP/paired-for-model/"
          cp -a "$RUNNER_TEMP/real-p0-source/first-party-request-candidates/ci-failure-triage-v4" "$RUNNER_TEMP/paired-for-model/"
      - name: Hand off only validated sealed packages (never source retrieval credential)
        if: github.event_name == 'workflow_dispatch' && inputs.consent == 'COMPARE_60_V3_V4_CALLS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pinned-v3-v4-generated-skill-pair
          path: ${{ runner.temp }}/paired-for-model/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  live-paired-model:
    if: github.event_name == 'workflow_dispatch' && inputs.consent == 'COMPARE_60_V3_V4_CALLS'
    needs: [sealed-source-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {}
    env:
      OPENAI_API_KEY: ${{ secrets.SKILL_MASON_HOST_OPENAI_API_KEY }}
      HOST_MODEL: ${{ inputs.model }}
    steps:
      - name: Checkout comparator only, no credentials persisted
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Receive verified generated bytes without GitHub token
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pinned-v3-v4-generated-skill-pair
          path: ${{ runner.temp }}/host-pair
      - name: Require separate owner provider credential, never a GitHub token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "PAIR_AUTH: owner provider credential not configured"; exit 2; }
          test -z "${GH_TOKEN:-}" && test -z "${GITHUB_TOKEN:-}"
      - name: Execute genuine 30-case x 2-version model A/B comparison
        shell: bash
        run: |
          set -euo pipefail
          node bin/ci-triage-v3-v4-compare.mjs \
            --v3-dir "$RUNNER_TEMP/host-pair/ci-failure-triage-v3" \
            --v4-dir "$RUNNER_TEMP/host-pair/ci-failure-triage-v4" \
            --model "$HOST_MODEL" \
            --report "$RUNNER_TEMP/ci-triage-v3-v4-30-case-host.json"
      - name: Preserve every response and provider-reported token count
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-triage-v3-v4-real-model-30-case-paired-observations
          path: |
            ${{ runner.temp }}/ci-triage-v3-v4-30-case-host.json
            ${{ runner.temp }}/ci-triage-v3-v4-30-case-host.json.partial.jsonl
          if-no-files-found: ignore
          retention-days: 14
