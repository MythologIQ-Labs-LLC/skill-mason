name: Repository security policy hold (not native Qortara qualification)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security-policy-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fail closed on unresolved security intake or structural errors
        run: python3 scripts/check_governance_static.py --root . --mode guard
